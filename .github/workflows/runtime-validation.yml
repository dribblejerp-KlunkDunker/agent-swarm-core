name: Runtime Validation

on:
  push:
    paths:
      - "runtime/**"
      - "tests/**"
      - "skills/**"
      - ".agent/**"
      - "README.md"
      - "SWARM_*.md"
      - "PRODUCTION_HARDENING.md"
      - "pyproject.toml"
      - ".claude/**"
      - ".gitignore"
      - ".github/workflows/runtime-validation.yml"
  pull_request:
    paths:
      - "runtime/**"
      - "tests/**"
      - "skills/**"
      - ".agent/**"
      - "README.md"
      - "SWARM_*.md"
      - "PRODUCTION_HARDENING.md"
      - "pyproject.toml"
      - ".claude/**"
      - ".gitignore"
      - ".github/workflows/runtime-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: runtime-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime-audit:
    name: runtime-audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONHASHSEED: "0"
    steps:
      - name: Check out repository (pinned action)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # checkout v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python (pinned action)
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # setup-python v5
        with:
          python-version: "3.12"
      - name: Check patch whitespace
        run: git diff --check HEAD^ HEAD
      - name: Compile runtime and tests
        run: python -m compileall -q runtime tests
      - name: Run regression tests
        run: python -m unittest discover -s tests -v
      - name: Run runtime audit
        # Includes a full production lifecycle on a real database file, keyed-audit tamper
        # and truncation detection, and the regression checks for every safety gate.
        run: python -m runtime selftest
      - name: Verify the package installs and exposes the swarm CLI
        run: |
          python -m pip install --quiet .
          cd "$RUNNER_TEMP"
          swarm --db "$RUNNER_TEMP/ci-state.sqlite3" task create ci-smoke --owner ci --objective "install check"
          swarm --db "$RUNNER_TEMP/ci-state.sqlite3" audit verify
